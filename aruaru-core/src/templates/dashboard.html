<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aruaru-core — VPS 管理センター</title>
<link rel="stylesheet" href="/static/css/core.css">
</head>
<body>
<nav class="navbar">
  <span class="logo">⚡ aruaru-core</span>
  <div class="nav-links">
    <a href="/">VPS一覧</a>
    <a href="/terminal">💻 ターミナル</a>
    <a href="/files">📁 ファイル管理</a>
  </div>
</nav>

<main>
  <div id="alerts"></div>

  <!-- VPS 管理 -->
  <section class="card">
    <div class="card-header">
      <h2>🖥️ VPS サーバー管理</h2>
      <button class="btn-primary" onclick="openVpsModal()">＋ VPS 追加</button>
    </div>
    <div id="vpsList"><div class="loading">読み込み中…</div></div>
  </section>

  <!-- SSH 鍵管理 -->
  <section class="card">
    <div class="card-header">
      <h2>🔑 SSH 鍵管理</h2>
      <button class="btn-primary" onclick="openKeyModal()">鍵ペアを自動生成</button>
    </div>
    <div id="keyList"><div class="loading">読み込み中…</div></div>
  </section>
</main>

<!-- VPS 追加モーダル -->
<div id="vpsModal" class="modal hidden">
  <div class="modal-box">
    <h3>🖥️ VPS サーバー追加</h3>

    <label>表示名</label>
    <input type="text" id="vpsName" placeholder="本番サーバー1">

    <label>IP アドレス <span class="required">*</span></label>
    <div style="display:flex;gap:.5rem">
      <input type="text" id="vpsIp" placeholder="123.456.789.0" style="flex:1">
      <button class="btn-secondary" id="detectBtn" onclick="autoDetectIp()"
        style="white-space:nowrap;font-size:.82rem">🔍 自動検出</button>
    </div>
    <div id="detectResult" style="font-size:.78rem;color:var(--muted);margin-top:.2rem;min-height:1rem"></div>

    <label>SSH ポート</label>
    <input type="number" id="vpsPort" value="22">

    <label>ユーザー名</label>
    <input type="text" id="vpsUser" value="root">

    <label>認証方式</label>
    <div class="radio-group">
      <label><input type="radio" name="vpsAuth" value="key" checked> SSH 鍵 <span class="badge">推奨</span></label>
      <label><input type="radio" name="vpsAuth" value="password"> パスワード</label>
    </div>

    <label>使用する SSH 鍵</label>
    <select id="vpsKeyId">
      <option value="">— 選択してください —</option>
    </select>
    <div style="font-size:.78rem;color:var(--muted)">
      鍵がない場合は「キャンセル」→「鍵ペアを自動生成」で作成してください
    </div>

    <div class="modal-actions">
      <button class="btn-primary" onclick="saveVps()">登録 &amp; 接続確認</button>
      <button class="btn-secondary" onclick="closeVpsModal()">キャンセル</button>
    </div>
  </div>
</div>

<!-- 鍵生成モーダル -->
<div id="keyModal" class="modal hidden">
  <div class="modal-box">
    <h3>🔑 SSH 鍵ペア自動生成</h3>
    <label>鍵の名前</label>
    <input type="text" id="keyName" placeholder="my-vps-key">
    <label>鍵の種類</label>
    <div class="radio-group">
      <label><input type="radio" name="keyType" value="ed25519" checked>
        Ed25519 <span class="badge">推奨・高速</span></label>
      <label><input type="radio" name="keyType" value="rsa"> RSA 4096</label>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="genKeyBtn" onclick="doGenerateKey()">自動生成</button>
      <button class="btn-secondary" onclick="closeKeyModal()">キャンセル</button>
    </div>
    <div id="keyResult" class="key-result hidden"></div>
  </div>
</div>

<script src="/static/js/core.js"></script>
</body>
</html>

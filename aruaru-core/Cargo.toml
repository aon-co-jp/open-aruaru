[package]
name    = "aruaru-core"
version = "0.1.0"
edition = "2021"
description = "aruaru-core — Web SSH ターミナル・SFTP・SSH鍵管理・VPS自動操作 (Rust + Poem)"

[[bin]]
name = "aruaru-core"
path = "src/main.rs"

[dependencies]
poem             = { version = "3", features = ["session", "cookie", "static-files", "websocket"] }
tokio            = { version = "1", features = ["full"] }
sqlx             = { version = "0.7", features = ["sqlite", "runtime-tokio", "uuid", "chrono"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
uuid             = { version = "1", features = ["v4", "serde"] }
chrono           = { version = "0.4", features = ["serde"] }
anyhow           = "1"
thiserror        = "1"
dotenv           = "0.15"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config           = "0.14"

# SSH / SFTP
russh            = "0.44"
russh-sftp       = "2"
russh-keys       = "0.44"

# SSH 鍵生成
ssh-key          = { version = "0.6", features = ["ed25519", "rsa", "std"] }
rand_core        = { version = "0.6", features = ["getrandom"] }

# ファイル転送
tokio-util       = { version = "0.7", features = ["io"] }
bytes            = "1"
futures-util     = "0.3"
reqwest          = { version = "0.11", features = ["json", "stream"] }

[dev-dependencies]
tokio-test = "0.4"

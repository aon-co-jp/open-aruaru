// open-runo Layer 2 受け口 — gRPC インターフェース定義
// open-web-server (Layer 1) → open-runo (Layer 2) の正式契約。
// QUIC 経路も同一メッセージを bincode で運ぶ (proto がマスター定義)。

syntax = "proto3";

package runo.v1;

service RunoArbiter {
  // 三重コミット書き込み。3/3 ACK まで待つ (deadline はクライアント指定)
  rpc CommitTriple (CommitRequest) returns (CommitResponse);

  // 多数決読み取り
  rpc QuorumRead (ReadRequest) returns (ReadResponse);

  // ストリーミング書き込み (GAMEの高頻度アイテム更新用)
  rpc CommitStream (stream CommitRequest) returns (stream CommitResponse);

  // レプリカ健全性の購読 (運用監視)
  rpc WatchHealth (HealthRequest) returns (stream HealthEvent);
}

message CommitRequest {
  string txn_id     = 1;  // UUIDv7 (Layer 1 で採番)
  string key        = 2;  // 論理キー "user:1234:wallet"
  bytes  payload    = 3;  // 値本体 (JSON bytes)
  bytes  checksum   = 4;  // BLAKE3(payload) 32 bytes — Layer 1 計算値
  uint64 deadline_ms = 5; // このUNIX時刻(ms)を過ぎたら中断しリカバリキューへ
  Priority priority = 6;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_GAME        = 1;  // アイテム付与など。低遅延優先
  PRIORITY_FINANCE     = 2;  // 金融・決済。完全性最優先 (fsync強制)
}

message CommitResponse {
  string txn_id          = 1;
  uint32 committed_layers = 2; // 0-3。3で完全確定
  bytes  checksum         = 3; // aruaru-db 側で再計算した BLAKE3
  Status status           = 4;
  repeated ReplicaAck acks = 5; // 監査用: どのレプリカが何ms でACKしたか
}

enum Status {
  STATUS_UNSPECIFIED     = 0;
  STATUS_COMMITTED       = 1; // 3/3
  STATUS_QUORUM_SAFE     = 2; // 2/3 — データは安全。自動修復キュー投入済み
  STATUS_FAILED          = 3; // 0-1/3 — Layer 1 は WAL からリトライすること
  STATUS_CHECKSUM_MISMATCH = 4; // 経路上の破損検出。即リトライ
}

message ReplicaAck {
  uint32 replica_id  = 1; // 0,1,2
  uint64 latency_us  = 2;
  bool   fsynced     = 3; // PRIORITY_FINANCE では必ず true
}

message ReadRequest {
  string key = 1;
  bool require_full_quorum = 2; // true: 3/3一致必須 (金融残高照会用)
}

message ReadResponse {
  bytes  payload  = 1;
  bytes  checksum = 2;
  uint32 agreeing_replicas = 3;
  bool   repair_triggered  = 4; // 不一致レプリカの自動修復を起動したか
}

message HealthRequest {}

message HealthEvent {
  uint32 replica_id = 1;
  bool   alive      = 2;
  uint64 lag_bytes  = 3; // WAL適用遅延
}

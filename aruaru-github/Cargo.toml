[package]
name = "aruaru-github"
version = "0.1.0"
edition = "2021"
description = "aruaru-github — フォルダ指定で GitHub に Push"
license = "MIT"

[[bin]]
name = "aruaru-github"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
rfd = "0.15"
anyhow = "1"
chrono = "0.4"
open = "5"

[profile.release]
lto = true
codegen-units = 1
# strip = true  # Windows で rare に CRC/AV 問題 — インストーラー時は無効

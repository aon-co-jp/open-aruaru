<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン — aruaru-easyweb</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-page">
<div class="login-card">
  <div class="logo-mark">🌐</div>
  <h1>aruaru-easyweb</h1>
  <p class="sub">メールアドレスを入力するとログインリンクを送信します</p>
  <form id="loginForm" action="/api/auth/login" method="POST">
    <input type="email" name="email" placeholder="your@email.com" required autofocus>
    <button type="submit">ログインリンクを送信</button>
  </form>
  <div id="message" class="message hidden"></div>
</div>
<script>
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = '送信中…';
    const res = await fetch('/api/auth/login', { method:'POST', body: new FormData(e.target) });
    const msg = document.getElementById('message');
    msg.classList.remove('hidden');
    if (res.ok) {
      msg.textContent = '✅ メールを送信しました。受信トレイをご確認ください。';
    } else {
      msg.style.cssText = 'border-color:var(--danger);color:var(--danger)';
      msg.textContent = '❌ 送信失敗。再度お試しください。';
      btn.disabled = false; btn.textContent = 'ログインリンクを送信';
    }
  });
</script>
</body>
</html>

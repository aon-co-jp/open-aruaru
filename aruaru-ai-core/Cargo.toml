[package]
name    = "aruaru-ai-core"
version = "0.1.0"
edition = "2021"
description = "aruaru-ai-core — AI ライブラリ（独立サービスとして起動しない）"

# [bin] なし → ライブラリクレートとして aruaru-easyweb に組み込まれる
[lib]
name = "aruaru_ai_core"
path = "src/lib.rs"

[dependencies]
tokio      = { version = "1", features = ["full"] }
sqlx       = { version = "0.7", features = ["sqlite", "runtime-tokio"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
chrono     = { version = "0.4", features = ["serde"] }
anyhow     = "1"
reqwest    = { version = "0.11", features = ["json"] }
poem       = { version = "3", features = ["session", "cookie"] }

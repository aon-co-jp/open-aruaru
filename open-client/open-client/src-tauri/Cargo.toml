[package]
name = "open-client"
version = "0.1.0"
edition = "2021"
authors = ["open-aruaru project (iLumi)"]
description = "open-aruaru unified frontend shell (Tauri v2) — native, low-footprint client for open-web-server / open-runo"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
bincode = "1"
blake3 = "1"
uuid = { version = "1", features = ["v7", "serde"] }
anyhow = "1"
aruaru-common = { path = "../../aruaru-common" }
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aruaru-dns</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">aruaru-dns</span>
        <span id="db-status" class="badge text-bg-secondary">DB …</span>
      </div>
    </nav>

    <main class="container pb-5">
      <section class="card mb-4 shadow-sm">
        <div class="card-body">
          <h2 class="h5 card-title">DNS セットアップガイド</h2>
          <form id="guide-form" class="row g-2 align-items-end">
            <div class="col-md-5">
              <label class="form-label">ゾーン（ドメイン）</label>
              <input class="form-control" name="zone" placeholder="example.com" required />
            </div>
            <div class="col-md-4">
              <label class="form-label">VPS IP</label>
              <input class="form-control" name="vps_ip" placeholder="160.251.237.162" required />
            </div>
            <div class="col-md-3">
              <button type="submit" class="btn btn-primary w-100">ガイド表示</button>
            </div>
          </form>
          <div id="guide-result" class="mt-3"></div>
        </div>
      </section>

      <section class="card mb-4 shadow-sm">
        <div class="card-body">
          <h2 class="h5 card-title">DNS レコード追加</h2>
          <form id="record-form" class="row g-2">
            <div class="col-md-3">
              <label class="form-label">ゾーン</label>
              <input class="form-control" name="zone" required />
            </div>
            <div class="col-md-2">
              <label class="form-label">名前</label>
              <input class="form-control" name="name" placeholder="@" />
            </div>
            <div class="col-md-2">
              <label class="form-label">タイプ</label>
              <select class="form-select" name="record_type">
                <option>A</option>
                <option>AAAA</option>
                <option>CNAME</option>
                <option>TXT</option>
                <option>NS</option>
                <option>MX</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">値</label>
              <input class="form-control" name="value" required />
            </div>
            <div class="col-md-1">
              <label class="form-label">TTL</label>
              <input class="form-control" name="ttl" type="number" value="3600" />
            </div>
            <div class="col-md-1 d-flex align-items-end">
              <button type="submit" class="btn btn-success w-100">追加</button>
            </div>
          </form>
          <p class="form-text mt-2">
            正本: PostgreSQL · 同期: aruaru-db（F:\aruaru\aruaru-db）
          </p>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 card-title mb-0">登録済みレコード</h2>
            <button id="sync-btn" class="btn btn-outline-secondary btn-sm">aruaru-db に同期</button>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover">
              <thead>
                <tr>
                  <th>ゾーン</th>
                  <th>名前</th>
                  <th>タイプ</th>
                  <th>値</th>
                  <th>TTL</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="records-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
